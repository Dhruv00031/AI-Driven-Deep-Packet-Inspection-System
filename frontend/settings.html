<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="assets/css/style.css">

</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- ============================================== -->
    <!-- Header -->
    <!-- ============================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>System Settings</h2>

        <a
            href="dashboard.html"
            class="btn btn-secondary">

            Dashboard

        </a>

    </div>


    <!-- ============================================== -->
    <!-- System Status -->
    <!-- ============================================== -->

    <div class="card mb-4">

        <div class="card-header">

            <h5>System Status</h5>

        </div>

        <div class="card-body">

            <table class="table">

                <tr>

                    <td>Backend Server</td>

                    <td id="backendStatus">
                        🟢 Online
                    </td>

                </tr>

                <tr>

                    <td>MongoDB</td>

                    <td id="mongoStatus">
                        🟢 Connected
                    </td>

                </tr>

                <tr>

                    <td>Python Engine</td>

                    <td id="pythonStatus">
                        🟢 Ready
                    </td>

                </tr>

                <tr>

                    <td>Simulator</td>

                    <td id="simulatorStatus">
                        🟢 Ready
                    </td>

                </tr>

            </table>

        </div>

    </div>


    <!-- ============================================== -->
    <!-- Preferences -->
    <!-- ============================================== -->

    <div class="card mb-4">

        <div class="card-header">

            <h5>Preferences</h5>

        </div>

        <div class="card-body">

            <div class="form-check mb-3">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="autoRefresh">

                <label class="form-check-label">

                    Auto Refresh Dashboard

                </label>

            </div>

            <div class="form-check mb-3">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="notifications">

                <label class="form-check-label">

                    Enable Notifications

                </label>

            </div>

            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="darkTheme">

                <label class="form-check-label">

                    Dark Theme

                </label>

            </div>

        </div>

    </div>


    <!-- ============================================== -->
    <!-- Statistics -->
    <!-- ============================================== -->

    <div class="card mb-4">

        <div class="card-header">

            <h5>Database Statistics</h5>

        </div>

        <div class="card-body">

            <p>Total Packets :
                <strong id="totalPackets">0</strong>
            </p>

            <p>Total Threats :
                <strong id="totalThreats">0</strong>
            </p>

        </div>

    </div>


    <!-- ============================================== -->
    <!-- Danger Zone -->
    <!-- ============================================== -->

    <div class="card border-danger">

        <div class="card-header bg-danger text-white">

            Danger Zone

        </div>

        <div class="card-body">

            <p>

                Delete every packet stored in MongoDB.

            </p>

            <button

                id="deleteAllPackets"

                class="btn btn-danger">

                Delete All Packets

            </button>

        </div>

    </div>

</div>

<script src="js/api.js"></script>

<script src="js/settings.js"></script>

</body>

</html>
